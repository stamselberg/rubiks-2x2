version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/react-app"
    schedule:
      interval: "monthly"
    # Security updates only: no routine version-bump PRs
    open-pull-requests-limit: 0
    groups:
      # One pull request for all security fixes, instead of one per package
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
